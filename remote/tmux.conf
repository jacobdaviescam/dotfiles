# Lean tmux config for headless Linux pods (RunPod). No plugins, no macOS bits.
# Keeps the same muscle memory as the local config (backtick prefix, vi, h/j/k/l).

set -g prefix `
unbind C-b
bind ` send-prefix          # press backtick twice to type a literal one

set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 0
set -g status-position top

# OSC52: copies made in the pod's tmux land in your LOCAL clipboard, through Ghostty+SSH.
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

# Splits keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fan-out: broadcast keystrokes to every pane (run one setup across many panes)
bind * setw synchronize-panes

bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind r command-prompt "rename-window %%"

# Minimal status bar (no plugins required)
set -g status-style "bg=default fg=white"
set -g status-left "#[bold] #S "
set -g status-right " #h  %H:%M "
set -g status-left-length 30
